services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ridepool
      POSTGRES_PASSWORD: ridepool
      POSTGRES_DB: ridepool
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ridepool -d ridepool']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: ridepool
    command: ['sh', '-c', 'node src/db/migrate.js && node src/db/seed.js']
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    image: ridepool
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
